<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authentic Edge | Contact</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
<script src="https://cdn.tailwindcss.com"></script>
<script src="tailwind-config.js"></script>
<style type="text/tailwindcss">
@layer base {
  a { @apply no-underline text-black relative; }
  body, html { @apply m-0 p-0 w-full overflow-x-hidden font-sans; }
}

@layer components {
  /* ===== LAYOUT ===== */
  .container { @apply w-full max-w-full m-0 p-0; }

  /* ===== NAVIGATION: EDITORIAL STYLE ===== */
  header { @apply border-b border-black/5 px-[5%] py-[1.1rem]; }
  .header-container { @apply flex justify-between items-center max-w-[1400px] mx-auto; }
  .logo { @apply font-sans font-extrabold uppercase text-[1.2rem] tracking-[0.1em]; }
  .logo a { @apply no-underline text-black; }
  .nav-menu a { @apply text-[0.8rem] uppercase font-semibold tracking-[0.05em] no-underline px-4; }

  /* ===== EDITORIAL FOOTER ===== */
  .site-footer {
    @apply w-full bg-white flex flex-col items-center justify-center text-center gap-[30px] border-t border-line box-border;
    padding: 60px 0 40px 0;
  }
  .footer-left { @apply w-full flex justify-center; }
  .footer-left .brand { @apply text-[1.2rem] font-extrabold uppercase tracking-[0.2em] text-black m-0 block w-full; }
  .footer-right { @apply flex flex-col items-center gap-[15px] w-full; }
  .footer-right a {
    @apply text-black no-underline text-[0.75rem] font-semibold uppercase tracking-[0.1em] relative inline-block transition-opacity duration-300 ease-in-out;
  }
  .footer-right a::after {
    content: '';
    @apply absolute h-px bg-black left-1/2 -translate-x-1/2 transition-[width] duration-300 ease-in-out w-0;
    bottom: -4px;
  }
  .footer-right a:hover::after { @apply w-full; }

  @media (max-width: 768px) {
    .site-footer { @apply gap-[25px]; padding: 60px 5% 100px 5%; }
    .footer-right { @apply gap-5; }
  }

  /* ===== MOBILE HEADER / NAV ===== */
  @media (min-width: 769px) {
    .menu-toggle { @apply !hidden; }
    .nav-menu {
      @apply !flex !flex-row !static !opacity-100 !pointer-events-auto !transform-none !bg-transparent !shadow-none !w-auto !max-w-none !p-0 !backdrop-blur-none gap-6;
    }
    .nav-menu a {
      @apply !p-0 !border-b-0 !text-[0.8rem] !text-black !font-semibold uppercase tracking-[0.05em] transition-opacity duration-200;
    }
    .nav-menu a:hover { @apply !bg-transparent opacity-50; }
  }

  @media (max-width: 768px) {
    header { @apply sticky top-0 bg-white; z-index: 10001; }
    .menu-toggle { @apply block text-[1.2rem] cursor-pointer text-black p-2 transition-transform duration-300; }
    .nav-menu {
      @apply hidden flex-col absolute top-full left-0 w-full bg-white border-b border-line;
      padding: 20px 0;
      z-index: 10000;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }
    .nav-menu.active { @apply flex; animation: slideIn 0.4s cubic-bezier(0.165, 0.84, 0.44, 1); }
    .nav-menu a {
      @apply text-[0.9rem] font-bold text-black no-underline uppercase tracking-[0.1em] border-b border-hairline;
      padding: 18px 10%;
    }
    .nav-menu a:last-child { @apply border-b-0; }
    .nav-menu a:hover { @apply bg-surface; padding-left: 12%; }
  }

  @media (max-width: 650px) {
    .bottom-tabs {
      @apply flex fixed bottom-0 left-0 w-full justify-around items-center border-t border-black/5;
      height: 65px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      z-index: 9999;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .bottom-tabs a { @apply text-faint text-[0.65rem] font-bold uppercase tracking-[0.05em] flex flex-col items-center gap-1.5 no-underline transition-colors duration-300; }
    .bottom-tabs a svg, .bottom-tabs a i { @apply w-5 h-5; }
    .bottom-tabs a.active { @apply text-black; }
    body { @apply !pb-[75px]; }
  }

  /* ===== BACK TO TOP ===== */
  .back-to-top {
    @apply fixed bottom-10 w-[50px] h-[50px] bg-black text-white border-none flex items-center justify-center cursor-pointer opacity-0 invisible;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    z-index: 2000;
    transition: all 0.4s cubic-bezier(0.19, 1, 0.22, 1);
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  }
  .back-to-top i { @apply text-[1.4rem]; }
  .back-to-top.active { @apply opacity-100 visible; transform: translateX(-50%) translateY(0); }
  .back-to-top:hover { @apply bg-charcoal; }

  @media (max-width: 900px) {
    .back-to-top { @apply w-[45px] h-[45px]; bottom: 90px; }
  }
}

@keyframes slideIn {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
<style type="text/tailwindcss">
@layer components {
  .contact-page-body { @apply bg-white text-black; }
  .contact-container {
    @apply max-w-[900px] mx-auto;
    padding: 120px 5% 100px;
    animation: fadeIn 0.8s ease;
  }
  .contact-header { @apply text-center mb-20; }

  .eyebrow { @apply block uppercase tracking-[0.3em] text-[0.7rem] font-bold text-faint mb-[1.2rem]; }
  .contact-header h2 { @apply text-[3.5rem] font-extrabold uppercase tracking-[-0.02em] mb-4; }
  .contact-header p { @apply text-muted text-[1.1rem] max-w-[500px] mx-auto leading-[1.6]; }

  /* FORM STYLING */
  .contact-form { @apply flex flex-col gap-[30px]; }
  .form-row { @apply grid grid-cols-2 gap-[30px]; }
  .form-group { @apply flex flex-col gap-[10px]; }
  .form-group label { @apply text-[0.7rem] uppercase font-bold tracking-[0.1em] text-black; }

  .contact-form input,
  .contact-form textarea,
  .country-code {
    @apply border-none border-b border-[#dddddd] text-base bg-transparent rounded-none outline-none;
    padding: 15px 0;
    transition: border-color 0.3s ease;
  }
  .contact-form input:focus,
  .contact-form textarea:focus { @apply border-b-black; }

  .phone-group { @apply flex gap-5; }
  .country-code { @apply w-20 cursor-pointer; }
  .contact-form textarea { @apply min-h-[120px] resize-y; }

  /* SUBMIT BUTTON */
  .btn-submit {
    @apply bg-black text-white border-none font-bold uppercase tracking-[0.2em] text-[0.8rem] cursor-pointer;
    margin-top: 20px;
    padding: 20px;
    transition: background 0.3s ease, transform 0.2s ease;
  }
  .btn-submit:hover { @apply bg-charcoal -translate-y-0.5; }

  @media (max-width: 768px) {
    .form-row { @apply grid-cols-1; }
    .contact-header h2 { @apply text-4xl; }
  }
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head> 
<body class="contact-page-body">

<header>
  <div class="header-container">
    <a href="index.html" style="text-decoration: none; color: inherit;">
      <h1 class="logo">Authentic Edge</h1>
    </a>
    <div class="menu-toggle" aria-label="Toggle navigation">☰</div>
    <nav class="nav-menu" id="header-buttons"></nav>
  </div>
</header>

<main class="contact-container">
  <section class="contact-header">
    <span class="eyebrow">Get in touch</span>
    <h2>Contact Us</h2>
    <p>Have questions about your subscription or a recent drop? Our team is here to help.</p>
  </section>

  <section class="contact-content">
    <form id="contactForm" class="contact-form">
      <div class="form-row">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="contactName" placeholder="Your Name" required>
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" placeholder="email@example.com" required>
        </div>
      </div>

      <div class="form-group">
        <label>Phone Number</label>
        <div class="phone-group">
          <select class="country-code" required>
            <option value="+31">🇳🇱 +31</option>
            <option value="+1">🇺🇸 +1</option>
            <option value="+44">🇬🇧 +44</option>
            <option value="+49">🇩🇪 +49</option>
            </select>
          <input type="tel" class="phone-input" placeholder="00 000 0000" required>
        </div>
      </div>

      <div class="form-group">
        <label>Message</label>
        <textarea id="contactDescription" placeholder="How can we help you?" required></textarea>
      </div>

      <button type="submit" class="btn-submit">Send Message</button>
    </form>
  </section>
</main>

<footer class="site-footer">
    <div class="footer-left">
      <p class="brand">the authentic edge</p>
    </div>

    <div class="footer-center">
      <a href="legal.html" class="legal-link">Privacy & Terms</a>
    </div>

    <div class="footer-right">
      <a href="mailto:authenticedge@gmail.com" class="email">authenticedge@gmail.com</a>
      <a href="https://instagram.com/theauthenticedge_/" target="_blank" class="insta-btn">Instagram</a>
    </div>
</footer>
<script src="https://www.google.com/recaptcha/api.js?render=6LfBhRQsAAAAANIKzqgbUZnKkNAH09Tgfd0d3s9I"></script>
<script type="module" src="contact.js"></script>
<script src="header.js"></script>
</body>
</html>
