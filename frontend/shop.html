<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Authentic Edge | Shop</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Roboto+Flex:wght@300;400;700&display=swap">
<script src="https://cdn.tailwindcss.com"></script>
<script src="tailwind-config.js"></script>
<style type="text/tailwindcss">
@layer components {
  * { @apply m-0 p-0 box-border; }
  html, body {
    @apply w-full min-h-screen text-white backdrop-blur-[8px] !overflow-x-hidden;
    font-family: 'Roboto Flex', sans-serif;
    background: rgba(0, 0, 0, 0.75) url('./images/homepage_background.jpg') center/cover no-repeat;
  }

  /* HEADER */
  header {
    @apply flex justify-between items-center sticky top-0 backdrop-blur-[12px];
    font-family: 'Libre Baskerville', serif;
    padding: 1.2rem 2rem;
    z-index: 999;
    background: rgba(10, 10, 10, 0.5);
  }
  .logo { @apply text-2xl font-bold text-white; }
  nav a {
    @apply ml-4 text-[#f2f2f2] font-medium no-underline relative;
    transition: color 0.2s;
  }
  nav a:hover { @apply text-[#ff9d00]; }
  nav a::after {
    content: '';
    @apply absolute left-0 bg-[#ff9d00] w-0;
    bottom: -3px;
    height: 2px;
    transition: width 0.3s;
  }
  nav a:hover::after { @apply w-full; }
  .menu-toggle { @apply hidden; }

  @media (max-width: 768px) {
    .menu-toggle { @apply block cursor-pointer text-white; font-size: 1.6em; z-index: 1000; }
    .nav-menu {
      @apply hidden absolute right-0 w-full flex-col text-center;
      top: 60px;
      background: rgba(10, 10, 10, 0.95);
      padding: 1rem 0;
    }
    .nav-menu.active { @apply flex; }
    .nav-menu a { @apply text-[1.1rem]; margin: 1rem 0; }
  }

  /* CARDS (All Card Types Unified) */
  .card, .product, .sub-card, .gift-card, .analytics-card {
    @apply rounded-[18px] border border-white/15 backdrop-blur-[10px] text-white text-center max-w-[260px] w-full min-h-[320px] flex flex-col justify-between;
    background: rgba(0, 0, 0, 0.52);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
    padding: 2rem 1.4rem;
    transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
  }
  .card:hover, .product:hover, .sub-card:hover, .gift-card:hover, .analytics-card:hover {
    transform: translateY(-6px) scale(1.03);
    @apply bg-white/15;
    box-shadow: 0 10px 28px rgba(255, 175, 0, 0.13);
  }
  .card.highlight, .sub-card.highlight {
    border: 1.5px solid #ff9d00;
    background: rgba(0, 0, 0, 0.62);
  }
  .card h3, .product-info h3, .sub-card h3, .gift-card h3, .analytics-card h3 {
    @apply text-white font-bold mb-4;
    font-family: 'Libre Baskerville', serif;
    font-size: 1.2rem;
    text-shadow: 0 2px 5px rgba(0, 0, 0, 0.6);
  }
  .card p, .product-info p, .sub-card p, .gift-card p, .analytics-card p {
    @apply text-[0.95rem] leading-[1.4] opacity-95 text-[#f2f2f2];
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
  }
  .product img, .gift-card img, .card img {
    @apply w-full h-[170px] object-contain rounded-t-xl;
    background: rgba(255, 255, 255, 0.04);
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  }

  /* GRID LAYOUTS */
  .product-grid, .sub-grid, .analytics {
    @apply grid gap-8 justify-items-center w-full;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  }
  .gift-grid { @apply flex flex-wrap gap-4 justify-center; }

  /* BUTTONS */
  .btn {
    @apply text-[#111111] rounded-[25px] font-semibold no-underline border-none text-[0.9rem] cursor-pointer;
    background: linear-gradient(135deg, #ffb400, #ff8800);
    padding: 0.7rem 1.4rem;
    transition: 0.3s;
  }
  .btn:hover {
    @apply bg-white text-[#111111];
    transform: translateY(-2px) scale(1.04);
  }

  /* HERO */
  .hero { @apply min-h-[85vh] flex flex-col items-center justify-center text-center text-white relative; padding: 0 1rem; }
  .hero::before {
    content: "";
    @apply absolute inset-0;
    background: linear-gradient(to bottom, rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.3));
    z-index: 0;
  }
  .hero-text { @apply relative; z-index: 1; animation: heroPopIn 0.3s ease-in-out forwards; }
  .hero-text h2 {
    @apply font-bold mb-8;
    font-family: 'Libre Baskerville', serif;
    font-size: 2.3rem;
    text-shadow: 0 3px 10px rgba(0, 0, 0, 0.4);
  }
  .hero-buttons {
    @apply flex justify-center gap-4 mt-4 opacity-0;
    animation: heroPopIn 1s ease-out 0.3s forwards;
  }

  @media (max-width: 900px) {
    .product-grid, .sub-grid, .analytics { @apply gap-5; grid-template-columns: repeat(2, 1fr); }
    .card, .product, .sub-card, .gift-card, .analytics-card { @apply max-w-[210px] min-h-[260px]; padding: 1.2rem 0.8rem; }
  }
  @media (max-width: 600px) {
    .product-grid, .sub-grid, .analytics { @apply grid-cols-1 gap-4; }
    .card, .product, .sub-card, .gift-card, .analytics-card { @apply max-w-[100vw] min-h-[150px]; padding: 0.9rem; }
    .gift-grid { @apply flex-col items-center; }
    .hero-text h2 { @apply text-[1.4rem]; }
  }
}

@keyframes heroPopIn {
  0% { opacity: 0; transform: scale(0.95) translateY(15px); }
  100% { opacity: 1; transform: scale(1) translateY(0); }
}
</style>
<style type="text/tailwindcss">
@layer components {
  /* ===== MOBILE HEADER / NAV (from mobile-header.css) ===== */
  @media (min-width: 769px) {
    .menu-toggle { @apply !hidden; }
    .nav-menu {
      @apply !flex !flex-row !static !opacity-100 !pointer-events-auto !transform-none !bg-transparent !shadow-none !w-auto !max-w-none !p-0 !backdrop-blur-none gap-6;
    }
    .nav-menu a {
      @apply !p-0 !border-b-0 !text-[0.8rem] !text-black !font-semibold uppercase tracking-[0.05em] transition-opacity duration-200;
    }
    .nav-menu a:hover { @apply !bg-transparent opacity-50; }
  }

  @media (max-width: 768px) {
    header { @apply sticky top-0 bg-white; z-index: 10001; }
    .menu-toggle { @apply block text-[1.2rem] cursor-pointer text-black p-2 transition-transform duration-300; }
    .nav-menu {
      @apply hidden flex-col absolute top-full left-0 w-full bg-white border-b border-line;
      padding: 20px 0;
      z-index: 10000;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }
    .nav-menu.active { @apply flex; animation: slideIn 0.4s cubic-bezier(0.165, 0.84, 0.44, 1); }
    .nav-menu a {
      @apply text-[0.9rem] font-bold text-black no-underline uppercase tracking-[0.1em] border-b border-hairline;
      padding: 18px 10%;
    }
    .nav-menu a:last-child { @apply border-b-0; }
    .nav-menu a:hover { @apply bg-surface; padding-left: 12%; }
  }

  @media (max-width: 650px) {
    .bottom-tabs {
      @apply flex fixed bottom-0 left-0 w-full justify-around items-center border-t border-black/5;
      height: 65px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      z-index: 9999;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .bottom-tabs a { @apply text-faint text-[0.65rem] font-bold uppercase tracking-[0.05em] flex flex-col items-center gap-1.5 no-underline transition-colors duration-300; }
    .bottom-tabs a svg, .bottom-tabs a i { @apply w-5 h-5; }
    .bottom-tabs a.active { @apply text-black; }
    body { @apply !pb-[75px]; }
  }

  .back-to-top {
    @apply fixed bottom-10 w-[50px] h-[50px] bg-black text-white border-none flex items-center justify-center cursor-pointer opacity-0 invisible;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    z-index: 2000;
    transition: all 0.4s cubic-bezier(0.19, 1, 0.22, 1);
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  }
  .back-to-top i { @apply text-[1.4rem]; }
  .back-to-top.active { @apply opacity-100 visible; transform: translateX(-50%) translateY(0); }
  .back-to-top:hover { @apply bg-charcoal; }

  @media (max-width: 900px) {
    .back-to-top { @apply w-[45px] h-[45px]; bottom: 90px; }
  }
}

@keyframes slideIn {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

  <!-- ===== HEADER ===== -->
<header>
  <h1 class="logo">Authentic Edge</h1>
  <div class="menu-toggle">☰</div>

  <nav class="nav-menu" id="header-buttons">
    <!-- Dynamic buttons inserted by header.js -->
  </nav>
</header>


  <!-- Return Button -->
  <a href="index.html" class="return-btn">← Return</a>

  <!-- ===== MAIN SHOP ===== -->
  <main class="shop">
    <section>
      <h2>All Products</h2>
      <div id="product-grid" class="product-grid">
        <p>Loading products...</p>
      </div>
    </section>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer>
    <p>The Authentic Edge</p>
    <p>authenticedge@gmail.com</p>
  </footer>
<script type="module">
    import { API_BASE_URL } from "./config.js";
  // === Responsive Menu ===
  document.querySelector(".menu-toggle").addEventListener("click", () => {
    document.querySelector(".nav-menu").classList.toggle("active");
  });

  // === Fetch Products from Database ===
  async function loadProducts() {
    const productGrid = document.getElementById("product-grid");
    try {
      const res = await fetch(`${API_BASE_URL}/api/products`);
      const products = await res.json();

      if (!res.ok) throw new Error("Failed to fetch products.");

      if (products.length === 0) {
        productGrid.innerHTML = "<p>No products available yet.</p>";
        return;
      }

      productGrid.innerHTML = products
        .map(
          (product) => `
          <div class="product" data-id="${product.id}">
            <a href="product.html?id=${product.id}">
              <img src="${product.image || "./images/placeholder.jpg"}" alt="${product.name}" />
              <div class="product-info">
                <h3>${product.name}</h3>
                <p>${product.description || "No description available"}</p>
              </div>
            </a>
          </div>
        `
        )
        .join("");
    } catch (err) {
      console.error("Error loading products:", err);
      productGrid.innerHTML =
        "<p>⚠️ Failed to load products. Please try again later.</p>";
    }
  }

  // Load products when page is ready
  document.addEventListener("DOMContentLoaded", loadProducts);
</script>
<script src="header.js"></script>


<!-- Other content... -->

<!-- Chat Widget - place near end of body -->
<div class="chat-widget">
  <div class="chat-toggle-btn">💬</div>
  <div class="chat-window">
    <div class="chat-header">Support</div>
    <div class="chat-body"></div>
    <div class="chat-input-bar">
      <input type="text" placeholder="Type your message..." />
      <label class="file-btn">📎<input type="file" hidden /></label>
      <button>➤</button>
    </div>
  </div>
</div>


<script src="path/to/user-chat.js"></script>

</body>
</html>
