<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Concierge | Authentic Edge</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
<script src="https://cdn.tailwindcss.com"></script>
<script src="tailwind-config.js"></script>
<style type="text/tailwindcss">
@layer base {
  a { @apply no-underline text-black relative; }
  body, html { @apply m-0 p-0 w-full overflow-x-hidden font-sans; }
}

@layer components {
  /* ===== LAYOUT ===== */
  .container { @apply w-full max-w-full m-0 p-0; }

  /* ===== NAVIGATION: EDITORIAL STYLE ===== */
  header { @apply border-b border-black/5 px-[5%] py-[1.1rem]; }
  .header-container { @apply flex justify-between items-center max-w-[1400px] mx-auto; }
  .logo { @apply font-sans font-extrabold uppercase text-[1.2rem] tracking-[0.1em]; }
  .logo a { @apply no-underline text-black; }
  .nav-menu a { @apply text-[0.8rem] uppercase font-semibold tracking-[0.05em] no-underline px-4; }

  /* ===== EDITORIAL FOOTER ===== */
  .site-footer {
    @apply w-full bg-white flex flex-col items-center justify-center text-center gap-[30px] border-t border-line box-border;
    padding: 60px 0 40px 0;
  }
  .footer-left { @apply w-full flex justify-center; }
  .footer-left .brand { @apply text-[1.2rem] font-extrabold uppercase tracking-[0.2em] text-black m-0 block w-full; }
  .footer-right { @apply flex flex-col items-center gap-[15px] w-full; }
  .footer-right a {
    @apply text-black no-underline text-[0.75rem] font-semibold uppercase tracking-[0.1em] relative inline-block transition-opacity duration-300 ease-in-out;
  }
  .footer-right a::after {
    content: '';
    @apply absolute h-px bg-black left-1/2 -translate-x-1/2 transition-[width] duration-300 ease-in-out w-0;
    bottom: -4px;
  }
  .footer-right a:hover::after { @apply w-full; }

  @media (max-width: 768px) {
    .site-footer { @apply gap-[25px]; padding: 60px 5% 100px 5%; }
    .footer-right { @apply gap-5; }
  }

  /* ===== MOBILE HEADER / NAV ===== */
  @media (min-width: 769px) {
    .menu-toggle { @apply !hidden; }
    .nav-menu {
      @apply !flex !flex-row !static !opacity-100 !pointer-events-auto !transform-none !bg-transparent !shadow-none !w-auto !max-w-none !p-0 !backdrop-blur-none gap-6;
    }
    .nav-menu a {
      @apply !p-0 !border-b-0 !text-[0.8rem] !text-black !font-semibold uppercase tracking-[0.05em] transition-opacity duration-200;
    }
    .nav-menu a:hover { @apply !bg-transparent opacity-50; }
  }

  @media (max-width: 768px) {
    header { @apply sticky top-0 bg-white; z-index: 10001; }
    .menu-toggle { @apply block text-[1.2rem] cursor-pointer text-black p-2 transition-transform duration-300; }
    .nav-menu {
      @apply hidden flex-col absolute top-full left-0 w-full bg-white border-b border-line;
      padding: 20px 0;
      z-index: 10000;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }
    .nav-menu.active { @apply flex; animation: slideIn 0.4s cubic-bezier(0.165, 0.84, 0.44, 1); }
    .nav-menu a {
      @apply text-[0.9rem] font-bold text-black no-underline uppercase tracking-[0.1em] border-b border-hairline;
      padding: 18px 10%;
    }
    .nav-menu a:last-child { @apply border-b-0; }
    .nav-menu a:hover { @apply bg-surface; padding-left: 12%; }
  }

  @media (max-width: 650px) {
    .bottom-tabs {
      @apply flex fixed bottom-0 left-0 w-full justify-around items-center border-t border-black/5;
      height: 65px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      z-index: 9999;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .bottom-tabs a { @apply text-faint text-[0.65rem] font-bold uppercase tracking-[0.05em] flex flex-col items-center gap-1.5 no-underline transition-colors duration-300; }
    .bottom-tabs a svg, .bottom-tabs a i { @apply w-5 h-5; }
    .bottom-tabs a.active { @apply text-black; }
    body { @apply !pb-[75px]; }
  }

  /* ===== BACK TO TOP ===== */
  .back-to-top {
    @apply fixed bottom-10 w-[50px] h-[50px] bg-black text-white border-none flex items-center justify-center cursor-pointer opacity-0 invisible;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    z-index: 2000;
    transition: all 0.4s cubic-bezier(0.19, 1, 0.22, 1);
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  }
  .back-to-top i { @apply text-[1.4rem]; }
  .back-to-top.active { @apply opacity-100 visible; transform: translateX(-50%) translateY(0); }
  .back-to-top:hover { @apply bg-charcoal; }

  @media (max-width: 900px) {
    .back-to-top { @apply w-[45px] h-[45px]; bottom: 90px; }
  }
}

@keyframes slideIn {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
<style type="text/tailwindcss">
@layer components {
  /* LAYOUT & CANVAS */
  .chat-full-screen { @apply bg-[#fcfcfc] h-screen flex justify-center items-center; padding-top: 80px; }
  .chat-canvas-full {
    @apply w-full max-w-[600px] h-[85vh] bg-white flex flex-col border border-line;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.03);
  }

  /* PRESENCE BAR (Top) */
  .admin-presence-bar { @apply bg-black text-white flex items-center; padding: 20px 25px; }
  .presence-info { @apply flex items-center gap-[15px]; }
  .avatar-circle { @apply w-[38px] h-[38px] bg-white text-black flex items-center justify-center font-extrabold text-[0.7rem] rounded-full; }
  .text-info { @apply flex flex-col; }
  .text-info .name { @apply text-[0.75rem] font-bold uppercase tracking-[0.05em]; }
  .text-info .status { @apply text-[0.6rem] opacity-60 tracking-[0.02em]; }

  /* MESSAGE STREAM */
  .message-stream { @apply flex-1 overflow-y-auto flex flex-col gap-5 bg-white; padding: 30px; }

  /* BUBBLES */
  .msg-bubble {
    @apply max-w-[80%] text-[0.85rem] leading-[1.6] tracking-[0.01em] relative;
    padding: 14px 18px;
  }
  .msg-bubble.user { @apply bg-black text-white rounded-none self-end text-left; }
  .msg-bubble.admin { @apply bg-[#f4f4f4] text-black rounded-none self-start; }

  /* IMAGES & LINKS */
  .chat-image { @apply max-w-full max-h-[300px] block mb-[10px] cursor-zoom-in border border-black/5; }
  .chat-link { @apply underline underline-offset-[3px] font-semibold; color: inherit; }

  /* COMPOSER AREA (Bottom) */
  .composer-area { @apply border-t border-line bg-white; padding: 20px; }
  .composer-container { @apply flex bg-hairline items-center border border-line; padding: 5px 15px; }

  #chatInput {
    @apply flex-1 border-none bg-transparent outline-none text-[0.85rem] font-sans;
    padding: 12px;
  }
  #chatSend {
    @apply bg-transparent border-none text-black cursor-pointer flex items-center;
    padding: 5px;
    transition: transform 0.2s;
  }
  #chatSend:hover { @apply translate-x-[3px]; }

  .icon-btn { @apply text-faint; transition: color 0.2s; }
  .icon-btn:hover { @apply !text-black; }
}
</style>
</head> 

<body class="messages-page"> 

  <header>
    <div class="header-container">
      <h1 class="logo"><a href="index.html">Authentic Edge</a></h1>
      <div class="menu-toggle" aria-label="Toggle navigation">☰</div>
      <nav class="nav-menu" id="header-buttons"></nav>
    </div>
  </header>

  <main class="chat-full-screen">
  <div class="chat-canvas-full">
    
    <div class="admin-presence-bar">
      <div class="presence-info">
        <div class="avatar-circle">AE</div>
        <div class="text-info">
          <span class="name">Concierge Support</span>
          <span class="status">Official Channel</span>
        </div>
      </div>
    </div>

    <div id="chatBox" class="message-stream">
        </div>

<div class="composer-area">
  <div id="imagePreviewContainer" style="display: none; padding: 10px; position: relative; background: #f9f9f9; border-top: 1px solid #eee;">
      <img id="imagePreview" src="" style="max-height: 100px; border-radius: 2px; border: 1px solid #000;">
      <button id="clearPreview" style="position: absolute; top: 15px; left: 105px; background: #ff0000; color: white; border: none; border-radius: 50%; width: 22px; height: 22px; cursor: pointer; font-weight: bold; line-height: 1;">×</button>
  </div>

  <div class="composer-container">
      <button id="attachBtn" class="icon-btn" type="button" style="background:none; border:none; cursor:pointer; padding: 0 10px; color: #666;">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4s-4 1.79-4 4v12.5c0 3.31 2.69 6 6 6s6-2.69 6-6V6h-1.5z"/>
          </svg>
      </button>

      <input id="fileInput" type="file" accept="image/*" hidden>

      <input type="text" id="chatInput" placeholder="Message Concierge..." autocomplete="off">
      
      <button id="chatSend">
          <svg viewBox="0 0 24 24" width="22" height="22">
              <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" fill="currentColor"></path>
          </svg>
      </button>
  </div>
</div>

  </div>
</main>

  <footer class="site-footer">
    <div class="footer-left"><p class="brand">the authentic edge</p></div>
    <div class="footer-right">
      <a href="mailto:authenticedge@gmail.com" class="email">authenticedge@gmail.com</a>
      <a href="https://instagram.com/theauthenticedge_/" target="_blank" class="insta-btn">Instagram</a>
    </div>
  </footer>

  <script src="header.js"></script>
  <script type="module" src="user-messages.js"></script>
</body>
</html>
